<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your order | Krunchie Snacks</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <header class="site-header">
    <div class="site-container header-inner">
      <a href="index.html" class="brand-logo" aria-label="Krunchie Snacks Homepage">
        <img src="assets/logo.webp" alt="Krunchie Snacks" class="logo-img" width="480" height="188">
      </a>
      <nav class="site-nav" aria-label="Main Navigation">
        <ul class="nav-list">
          <li><a href="index.html#flavours" class="nav-link">Shop</a></li>
          <li><a href="index.html#contact" class="nav-link">Contact</a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <a href="checkout.html" class="cart-btn" aria-label="Cart">Cart <span class="cart-count" data-cart-count hidden>0</span></a>
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="ms">MY</button>
          <button type="button" data-lang="zh">CN</button>
        </div>
      </div>
    </div>
  </header>
  <main class="page-main">
    <div class="site-container narrow">
      <div id="order-box" aria-live="polite"><p>Loading…</p></div>
    </div>
  </main>
  <script src="i18n.js?v=7"></script>
  <script src="shop.js?v=1"></script>
  <script>
    (async () => {
      const box = document.getElementById('order-box');
      const id = new URLSearchParams(location.search).get('id') || '';
      const draw = async () => {
        let o;
        try {
          const r = await fetch('/api/orders/' + encodeURIComponent(id));
          if (!r.ok) throw 0;
          o = await r.json();
        } catch {
          box.replaceChildren(el('h1', { className: 'page-title' }, tr('Order not found')), el('a', { className: 'btn btn-secondary', href: 'index.html' }, tr('Back to shop')));
          return;
        }
        const lines = el('div', { className: 'drawer-lines' });
        renderLines(lines, o.items, false);
        box.replaceChildren(
          el('h1', { className: 'page-title' }, tr('Thank you for your order')),
          el('p', { className: 'test-banner' }, tr('Testing mode: this is a test order, no payment was taken.')),
          el('p', {}, tr('Order number'), ': ', el('strong', {}, o.id)),
          el('p', {}, tr('Status'), ': ', el('span', { className: 'status status-' + o.status }, tr(o.status))),
          el('p', {}, tr('Delivery'), ': ', tr(o.delivery)),
          el('p', {}, tr('Payment'), ': ', tr(o.payment)),
          lines,
          el('dl', { className: 'totals' },
            el('div', {}, el('dt', {}, tr('Subtotal')), el('dd', {}, rm(o.subtotal))),
            el('div', {}, el('dt', {}, tr('Delivery')), el('dd', {}, rm(o.fee))),
            el('div', { className: 'grand' }, el('dt', {}, tr('Total')), el('dd', {}, rm(o.total)))),
          el('p', {}, tr('Keep this page link to check your order status later.')),
          el('a', { className: 'btn btn-secondary', href: 'index.html' }, tr('Back to shop')));
      };
      draw();
      document.addEventListener('langchange', draw);
    })();
  </script>
</body>
</html>
